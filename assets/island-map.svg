<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img">
  <title>NBA 政策島：原創籃球群落</title>
  <desc>四面環海的原創島嶼，以西岸海灣、洛城街區、西南沙漠、西部高地、北部林地、五大湖、南部及東岸街區連接中央廣場、道路、橋梁與碼頭。十六座球館、十五座公共球場與三個偶遇地點由頁面同座標疊加，並非實際地理地圖。</desc>
